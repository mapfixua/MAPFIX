<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapfix — Новий пароль</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .wrap { width: 100%; max-width: 400px; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; text-align: center; }
    .sub { color: #64748b; margin-bottom: 24px; text-align: center; }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      min-height: 46px;
    }
    .msg { margin-top: 14px; padding: 12px; border-radius: 8px; display: none; }
    .msg.err { display: block; background: #fee2e2; color: #991b1b; }
    .msg.ok { display: block; background: #dcfce7; color: #166534; }
    .links { margin-top: 20px; text-align: center; }
    .links a { color: #007bff; text-decoration: none; }
    .password-field { display: flex; gap: 8px; margin-bottom: 14px; }
    .password-field input { margin-bottom: 0; flex: 1; }
    .password-toggle {
      width: auto; min-width: 48px; background: #f1f5f9; color: #0f172a;
      border: 1px solid #cbd5e1; font-size: 0.78rem; font-weight: 700; padding: 0 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Новий пароль</h1>
    <p class="sub">Вкажіть новий пароль для акаунта Mapfix</p>
    <div class="card">
      <label for="password">Новий пароль</label>
      <div class="password-field">
        <input id="password" type="password" minlength="6" autocomplete="new-password">
        <button type="button" class="password-toggle" id="toggle">Показати</button>
      </div>
      <label for="password2">Повторіть пароль</label>
      <input id="password2" type="password" minlength="6" autocomplete="new-password">
      <button type="button" id="saveBtn">Зберегти</button>
      <div id="message" class="msg"></div>
    </div>
    <p class="links"><a href="/login.html">← До входу</a></p>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token') || '';
    const message = document.getElementById('message');

    if (!token) {
      message.className = 'msg err';
      message.textContent = 'Немає токена відновлення. Запросіть нове посилання.';
      document.getElementById('saveBtn').disabled = true;
    }

    document.getElementById('toggle').onclick = () => {
      const input = document.getElementById('password');
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      document.getElementById('toggle').textContent = show ? 'Сховати' : 'Показати';
    };

    document.getElementById('saveBtn').onclick = async () => {
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      if (password !== password2) {
        message.className = 'msg err';
        message.textContent = 'Паролі не збігаються';
        return;
      }
      try {
        const res = await fetch('/api/auth/password/reset', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ method: 'email', token, newPassword: password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || data.error);
        message.className = 'msg ok';
        message.textContent = 'Пароль оновлено. Перенаправлення…';
        const role = data.user?.role;
        setTimeout(() => {
          if (role === 'admin' || role === 'provider') location.href = '/admin';
          else if (role === 'client') location.href = '/client';
          else location.href = '/login.html';
        }, 800);
      } catch (err) {
        message.className = 'msg err';
        message.textContent = err.message;
      }
    };
  </script>
</body>
</html>
