<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapfix — Новий пароль</title>
  <link rel="stylesheet" href="/css/mapfix-ui.css">
</head>
<body class="mf-auth-body">
  <div class="mf-auth-wrap">
    <a class="mf-back" href="/login.html">← До входу</a>
    <div class="mf-card">
      <div class="mf-brand">
        <span class="mf-brand-mark" aria-hidden="true">M</span>
        <span class="mf-brand-name">Mapfix</span>
      </div>
      <h1 class="mf-title">Новий пароль</h1>
      <p class="mf-sub">Вкажіть новий пароль для акаунта Mapfix.</p>
      <label class="mf-label" for="password">Новий пароль</label>
      <div class="password-field">
        <input id="password" type="password" minlength="6" autocomplete="new-password">
        <button type="button" class="password-toggle" id="toggle">Показати</button>
      </div>
      <label class="mf-label" for="password2">Повторіть пароль</label>
      <input id="password2" type="password" minlength="6" autocomplete="new-password">
      <button type="button" id="saveBtn">Зберегти</button>
      <div id="message" class="msg"></div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token') || '';
    const message = document.getElementById('message');

    if (!token) {
      message.className = 'msg err';
      message.textContent = 'Немає токена відновлення. Запросіть нове посилання.';
      document.getElementById('saveBtn').disabled = true;
    }

    document.getElementById('toggle').onclick = () => {
      const input = document.getElementById('password');
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      document.getElementById('toggle').textContent = show ? 'Сховати' : 'Показати';
    };

    document.getElementById('saveBtn').onclick = async () => {
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      if (password !== password2) {
        message.className = 'msg err';
        message.textContent = 'Паролі не збігаються';
        return;
      }
      try {
        const res = await fetch('/api/auth/password/reset', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ method: 'email', token, newPassword: password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || data.error);
        message.className = 'msg ok';
        message.textContent = 'Пароль оновлено. Перенаправлення…';
        const role = data.user?.role;
        setTimeout(() => {
          if (role === 'admin' || role === 'provider') location.href = '/admin';
          else if (role === 'client') location.href = '/client';
          else location.href = '/login.html';
        }, 800);
      } catch (err) {
        message.className = 'msg err';
        message.textContent = err.message;
      }
    };
  </script>
</body>
</html>
