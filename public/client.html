<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapfix — Кабінет клієнта</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .wrap { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0; }
    h2 { font-size: 1.1rem; margin: 0 0 12px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .sub { color: #64748b; font-size: 0.9rem; }
    .card { background: #fff; border-radius: 12px; padding: 20px; border: 1px solid #e2e8f0; margin-bottom: 16px; }
    .item { border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; margin-bottom: 10px; background: #f8fafc; }
    .item-title { font-weight: 700; margin-bottom: 4px; }
    .item-meta { font-size: 0.85rem; color: #64748b; }
    .status { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; margin-top: 8px; }
    .status-wait { background: #fef3c7; color: #92400e; }
    .status-work { background: #dbeafe; color: #1e40af; }
    .status-done { background: #dcfce7; color: #166534; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin: 10px 0 6px; }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font: inherit;
    }
    button, .btn-link {
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      background: #007bff;
      color: #fff;
      text-decoration: none;
      display: inline-block;
      margin-top: 8px;
    }
    .btn-secondary { background: #64748b; }
    .btn-outline { background: #fff; color: #007bff; border: 1px solid #007bff; }
    .empty { color: #94a3b8; text-align: center; padding: 20px; font-size: 0.9rem; }
    .links { text-align: center; margin-top: 20px; }
    .links a { color: #007bff; }
    .msg { margin-top: 10px; font-size: 0.9rem; }
    .msg.ok { color: #166534; }
    .msg.err { color: #b91c1c; }
    .photo-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .photo-row img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid #e2e8f0; }
    .reply-box { margin-top: 8px; padding: 10px; background: #eff6ff; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>Кабінет клієнта</h1>
        <p class="sub" id="userInfo"></p>
      </div>
      <button type="button" class="btn-secondary" id="logoutBtn">Вийти</button>
    </div>

    <div class="card">
      <h2>📋 Історія замовлень</h2>
      <div id="ordersList"><p class="empty">Завантаження…</p></div>
    </div>

    <div class="card">
      <h2>⭐ Обране</h2>
      <p class="sub" style="margin-top:-8px;margin-bottom:12px">Збережені точки для швидкого доступу з карти</p>
      <div id="favoritesList"><p class="empty">Завантаження…</p></div>
    </div>

    <div class="card">
      <h2>🆘 Звʼязатись з підтримкою</h2>
      <p class="sub" style="margin-top:-8px;margin-bottom:12px">Напишіть нам — можна додати фото проблеми</p>
      <form id="supportForm">
        <label for="supportSubject">Тема</label>
        <input id="supportSubject" type="text" required maxlength="120" placeholder="Коротко про питання">
        <label for="supportMessage">Повідомлення</label>
        <textarea id="supportMessage" required rows="4" maxlength="4000" placeholder="Опишіть деталі…"></textarea>
        <label for="supportPhotos">Фото (до 3)</label>
        <input id="supportPhotos" type="file" accept="image/jpeg,image/png,image/webp" multiple>
        <button type="submit">Надіслати</button>
        <div id="supportMsg" class="msg"></div>
      </form>
      <h2 style="margin-top:24px">Мої звернення</h2>
      <div id="supportList"><p class="empty">Порожньо</p></div>
    </div>

    <p class="links">
      <a href="/">🗺️ Відкрити карту</a>
      · <a href="/privacy.html">Конфіденційність</a>
      · <a href="/terms.html">Умови</a>
    </p>
  </div>

  <script>
    function statusClass(s) {
      if (s === 'Виконано') return 'status-done';
      if (s === 'В роботі') return 'status-work';
      return 'status-wait';
    }

    function supportStatusLabel(status) {
      if (status === 'done') return 'Вирішено';
      if (status === 'in_progress') return 'В роботі';
      return 'Нове';
    }

    function formatDate(iso) {
      try {
        return new Date(iso).toLocaleString('uk-UA');
      } catch (_) {
        return iso;
      }
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }

    function photosHtml(photos) {
      if (!Array.isArray(photos) || !photos.length) return '';
      return `<div class="photo-row">${photos
        .map((p) => `<a href="${escapeHtml(p.url)}" target="_blank" rel="noopener"><img src="${escapeHtml(p.url)}" alt=""></a>`)
        .join('')}</div>`;
    }

    function compressImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Не вдалося прочитати файл'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Невірне зображення'));
          img.onload = () => {
            const max = 1280;
            let { width, height } = img;
            if (width > max || height > max) {
              const scale = Math.min(max / width, max / height);
              width = Math.round(width * scale);
              height = Math.round(height * scale);
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.82));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('logoutBtn').onclick = async () => {
      await fetch('/api/logout', { method: 'POST' }).catch(() => {});
      location.href = '/login.html';
    };

    async function loadSupport() {
      const el = document.getElementById('supportList');
      const res = await fetch('/api/support/tickets/mine');
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Помилка звернень');
      const tickets = data.tickets || [];
      if (!tickets.length) {
        el.innerHTML = '<p class="empty">Звернень ще немає</p>';
        return;
      }
      el.innerHTML = tickets
        .map(
          (t) => `
        <div class="item">
          <div class="item-title">${escapeHtml(t.subject)}</div>
          <div class="item-meta">${escapeHtml(supportStatusLabel(t.status))} · ${escapeHtml(formatDate(t.createdAt))}</div>
          <div class="item-meta" style="white-space:pre-wrap;margin-top:6px">${escapeHtml(t.message)}</div>
          ${photosHtml(t.photos)}
          ${
            t.adminReply
              ? `<div class="reply-box"><b>Відповідь підтримки</b><div style="white-space:pre-wrap;margin-top:4px">${escapeHtml(t.adminReply)}</div>${photosHtml(t.adminPhotos)}</div>`
              : ''
          }
        </div>`
        )
        .join('');
    }

    document.getElementById('supportForm').onsubmit = async (e) => {
      e.preventDefault();
      const msg = document.getElementById('supportMsg');
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      msg.textContent = '';
      try {
        const files = [...document.getElementById('supportPhotos').files].slice(0, 3);
        const photos = [];
        for (const f of files) photos.push(await compressImageFile(f));
        const res = await fetch('/api/support/tickets', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            subject: document.getElementById('supportSubject').value,
            message: document.getElementById('supportMessage').value,
            photos,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Не вдалося надіслати');
        msg.className = 'msg ok';
        msg.textContent = 'Звернення надіслано';
        e.target.reset();
        await loadSupport();
      } catch (err) {
        msg.className = 'msg err';
        msg.textContent = err.message;
      } finally {
        btn.disabled = false;
      }
    };

    async function load() {
      const meRes = await fetch('/api/me');
      const me = await meRes.json();
      if (!me.loggedIn || me.user.role !== 'client') {
        location.href = '/login.html';
        return;
      }
      document.getElementById('userInfo').textContent = me.user.login;

      const res = await fetch('/api/client/dashboard');
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);

      const ordersEl = document.getElementById('ordersList');
      if (!data.orders.length) {
        ordersEl.innerHTML = '<p class="empty">Замовлень ще немає. Оберіть послугу на карті та натисніть «Замовити».</p>';
      } else {
        ordersEl.innerHTML = data.orders
          .map(
            (o) => `
          <div class="item">
            <div class="item-title">${escapeHtml(o.serviceName)}</div>
            <div class="item-meta">${escapeHtml(o.locationTitle)} · ${escapeHtml(o.price)}</div>
            <div class="item-meta">${escapeHtml(o.locationAddress)}</div>
            ${o.preferredAt ? `<div class="item-meta">Бажаний час: ${escapeHtml(o.preferredAt)}</div>` : ''}
            ${o.note ? `<div class="item-meta">Коментар: ${escapeHtml(o.note)}</div>` : ''}
            <div class="item-meta">${formatDate(o.createdAt)}</div>
            <span class="status ${statusClass(o.status)}">${escapeHtml(o.status)}</span>
          </div>`
          )
          .join('');
      }

      const favEl = document.getElementById('favoritesList');
      if (!data.favorites.length) {
        favEl.innerHTML =
          '<p class="empty">Додайте точки в обране з картки закладу (кнопка «В обране»).</p>';
      } else {
        favEl.innerHTML = data.favorites
          .map(
            (f) => `
          <div class="item">
            <div class="item-title">${escapeHtml(f.title)}</div>
            <div class="item-meta">${escapeHtml(f.address)}</div>
            <a class="btn-link btn-outline" href="/?loc=${encodeURIComponent(f.id)}">Відкрити на карті</a>
            <button type="button" class="btn-secondary" data-unfav="${f.id}">Прибрати</button>
          </div>`
          )
          .join('');

        favEl.querySelectorAll('[data-unfav]').forEach((btn) => {
          btn.onclick = async () => {
            await fetch('/api/client/favorites/' + btn.dataset.unfav, { method: 'DELETE' });
            load();
          };
        });
      }

      await loadSupport();
    }

    load().catch((e) => alert(e.message));
  </script>
</body>
</html>
