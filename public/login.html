<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapfix — Вхід</title>
  <link rel="stylesheet" href="/css/mapfix-ui.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js" async defer></script>
</head>
<body class="mf-auth-body">
  <div class="mf-auth-wrap">
    <a class="mf-back" href="/">← На головну</a>

    <div class="mf-card">
      <div class="mf-brand">
        <span class="mf-brand-mark" aria-hidden="true">M</span>
        <span class="mf-brand-name">Mapfix</span>
      </div>

      <h1 class="mf-title">Вхід</h1>
      <p class="mf-sub">Увійдіть логіном і паролем, Google / Apple або кодом з Telegram (якщо бот уже підключений).</p>

      <nav class="mf-seg" aria-label="Вхід або реєстрація">
        <a class="active" href="/login.html">Вхід</a>
        <a href="/register.html">Реєстрація</a>
      </nav>

      <div id="oauthBlock" class="mf-oauth mf-hidden">
        <button type="button" class="mf-oauth-btn" id="googleBtn"><span class="g-icon">G</span> Увійти з Google</button>
        <button type="button" class="mf-oauth-btn" id="appleBtn"><span class="a-icon"></span> Увійти з Apple</button>
      </div>
      <div id="oauthOr" class="mf-or mf-hidden">або</div>

      <form id="classicForm">
        <label class="mf-label" for="login">Логін</label>
        <input id="login" name="login" type="text" autocomplete="username" placeholder="Ваш логін" required>
        <label class="mf-label" for="password">Пароль</label>
        <div class="mf-password">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Пароль" required>
          <button type="button" class="mf-toggle-eye" id="passwordToggle"><span class="eye-label">Показати</span></button>
        </div>
        <button type="submit" class="mf-btn mf-btn-primary" id="classicSubmitBtn">
          <span id="classicSubmitText">Увійти</span>
        </button>
      </form>

      <hr class="mf-divider">

      <button type="button" class="mf-btn mf-btn-ghost" id="toggleTelegramBtn">Вхід через Telegram-код</button>

      <div id="telegramBlock" class="mf-hidden" style="margin-top:14px">
        <div id="stepPhone">
          <label class="mf-label" for="phone">Номер телефону</label>
          <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+380661486347">
          <p class="mf-hint">Працює лише якщо Telegram уже підключено до акаунта</p>
          <button type="button" class="mf-btn mf-btn-dark" id="requestBtn"><span id="requestBtnText">Отримати код</span></button>
        </div>
        <div id="stepOtp" class="mf-hidden">
          <p class="mf-phone-sent">Код надіслано на <strong id="phoneDisplay"></strong></p>
          <label class="mf-label" for="otpCode">Код з Telegram</label>
          <input id="otpCode" class="mf-otp-input" type="text" inputmode="numeric" maxlength="6" placeholder="000000">
          <button type="button" class="mf-btn mf-btn-dark" id="verifyBtn"><span id="verifyBtnText">Підтвердити</span></button>
          <button type="button" class="mf-btn mf-btn-link" id="changePhoneBtn">Змінити номер</button>
        </div>
      </div>

      <div id="message" class="mf-msg" role="alert"></div>
    </div>

    <p class="mf-foot">
      Немає акаунта? <a href="/register.html">Зареєструйтесь</a>.
      Підключити Telegram: <a href="/link-telegram.html">тут</a>.
    </p>
    <p class="mf-links"><a href="/forgot-password.html">Забули пароль?</a></p>
  </div>

  <script>
    const classicForm = document.getElementById('classicForm');
    const message = document.getElementById('message');
    const telegramBlock = document.getElementById('telegramBlock');
    const stepPhone = document.getElementById('stepPhone');
    const stepOtp = document.getElementById('stepOtp');
    let oauthConfig = {};
    let savedPhone = '';

    function redirectByRole(role) {
      if (role === 'admin' || role === 'provider') location.href = '/admin';
      else if (role === 'client') location.href = '/client';
      else location.href = '/';
    }

    function showError(text, html) {
      if (html) message.innerHTML = html;
      else message.textContent = text;
      message.className = 'mf-msg err';
    }
    function showSuccess(text) {
      message.textContent = text;
      message.className = 'mf-msg ok';
    }
    function clearMessage() {
      message.textContent = '';
      message.className = 'mf-msg';
      message.innerHTML = '';
    }

    document.getElementById('toggleTelegramBtn').onclick = () => {
      telegramBlock.classList.toggle('mf-hidden');
    };

    classicForm.onsubmit = async (e) => {
      e.preventDefault();
      clearMessage();
      const btn = document.getElementById('classicSubmitBtn');
      const text = document.getElementById('classicSubmitText');
      btn.disabled = true;
      text.textContent = 'Вхід…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            login: classicForm.login.value.trim().toLowerCase(),
            password: classicForm.password.value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Помилка входу');
        redirectByRole(data.user.role);
      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
        text.textContent = 'Увійти';
      }
    };

    document.getElementById('requestBtn').onclick = async () => {
      clearMessage();
      const phone = document.getElementById('phone').value.trim();
      if (!phone) return showError('Вкажіть номер телефону');
      document.getElementById('requestBtn').disabled = true;
      try {
        const res = await fetch('/api/auth/otp/request', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          if (data.error === 'telegram_not_linked') {
            showError(
              null,
              'Telegram ще не підключено до цього номера. Увійдіть логіном/паролем, потім <a href="/link-telegram.html">підключіть Telegram</a> — і коди почнуть приходити.'
            );
            return;
          }
          if (data.error === 'user_not_found') {
            showError(null, 'Акаунта з цим номером немає. <a href="/register.html">Зареєструйтесь</a>.');
            return;
          }
          throw new Error(data.message || data.error || 'Не вдалося надіслати код');
        }
        savedPhone = data.phone || phone;
        document.getElementById('phoneDisplay').textContent = savedPhone;
        stepPhone.classList.add('mf-hidden');
        stepOtp.classList.remove('mf-hidden');
        showSuccess('Код надіслано в Telegram');
      } catch (err) {
        showError(err.message);
      } finally {
        document.getElementById('requestBtn').disabled = false;
      }
    };

    document.getElementById('verifyBtn').onclick = async () => {
      clearMessage();
      const code = document.getElementById('otpCode').value.replace(/\D/g, '');
      if (!/^\d{6}$/.test(code)) return showError('Введіть 6-значний код');
      try {
        const res = await fetch('/api/auth/otp/verify', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: savedPhone, code }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.message || data.error || 'Невірний код');
        redirectByRole(data.user.role);
      } catch (err) {
        showError(err.message);
      }
    };

    document.getElementById('changePhoneBtn').onclick = () => {
      stepOtp.classList.add('mf-hidden');
      stepPhone.classList.remove('mf-hidden');
      clearMessage();
    };

    document.getElementById('passwordToggle').onclick = () => {
      const input = document.getElementById('password');
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      document.querySelector('#passwordToggle .eye-label').textContent = show ? 'Сховати' : 'Показати';
    };

    function makeNonce() {
      const bytes = new Uint8Array(16);
      crypto.getRandomValues(bytes);
      return Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
    }
    async function sha256Hex(value) {
      const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(value));
      return Array.from(new Uint8Array(hash), (b) => b.toString(16).padStart(2, '0')).join('');
    }

    async function finishOauth(path, body) {
      showSuccess('Вхід…');
      const res = await fetch(path, {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || data.error || 'Помилка OAuth');
      redirectByRole(data.user?.role);
    }

    async function initOauth() {
      try {
        const res = await fetch('/api/auth/oauth-config', { cache: 'no-store' });
        oauthConfig = await res.json();
      } catch (_) { return; }

      const show = oauthConfig.googleEnabled || oauthConfig.appleEnabled;
      document.getElementById('oauthBlock').classList.toggle('mf-hidden', !show);
      document.getElementById('oauthOr').classList.toggle('mf-hidden', !show);
      document.getElementById('googleBtn').classList.toggle('mf-hidden', !oauthConfig.googleEnabled);
      document.getElementById('appleBtn').classList.toggle('mf-hidden', !oauthConfig.appleEnabled);

      if (oauthConfig.googleEnabled && window.google?.accounts?.id) {
        google.accounts.id.initialize({
          client_id: oauthConfig.googleClientId,
          callback: async (response) => {
            try {
              await finishOauth('/api/auth/google', { credential: response.credential, role: 'client' });
            } catch (err) {
              showError(err.message);
            }
          },
        });
      }

      document.getElementById('googleBtn').onclick = () => {
        if (!oauthConfig.googleEnabled) return showError('Додайте GOOGLE_CLIENT_ID у Vercel Env');
        if (window.google?.accounts?.id) google.accounts.id.prompt();
        else showError('Google SDK ще завантажується');
      };

      document.getElementById('appleBtn').onclick = async () => {
        if (!oauthConfig.appleEnabled) return showError('Додайте APPLE_CLIENT_ID у Vercel Env');
        if (!window.AppleID) return showError('Apple SDK ще завантажується');
        try {
          const rawNonce = makeNonce();
          AppleID.auth.init({
            clientId: oauthConfig.appleClientId,
            scope: 'name email',
            redirectURI: location.origin + '/login.html',
            usePopup: true,
            nonce: await sha256Hex(rawNonce),
          });
          const result = await AppleID.auth.signIn();
          await finishOauth('/api/auth/apple', {
            idToken: result?.authorization?.id_token,
            rawNonce,
            role: 'client',
          });
        } catch (err) {
          if (err?.error !== 'popup_closed_by_user') showError(err.message || 'Apple Sign In скасовано');
        }
      };
    }

    fetch('/api/me', { credentials: 'same-origin', cache: 'no-store' })
      .then((r) => r.json())
      .then((d) => { if (d.loggedIn) redirectByRole(d.user.role); })
      .catch(() => {});

    window.addEventListener('load', initOauth);
    setTimeout(initOauth, 800);
  </script>
</body>
</html>
