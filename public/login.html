<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapfix — Вхід</title>
  <link rel="stylesheet" href="/css/mapfix-ui.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js" async defer></script>
</head>
<body class="mf-auth-body">
  <div class="mf-auth-wrap">
    <a class="mf-back" href="/">← На головну</a>

    <div class="mf-card">
      <div class="mf-brand">
        <span class="mf-brand-mark" aria-hidden="true">M</span>
        <span class="mf-brand-name">Mapfix</span>
      </div>

      <h1 class="mf-title">Вхід</h1>
      <p class="mf-sub" id="loginSub">Увійдіть логіном і паролем. Якщо акаунта ще немає — зареєструйтесь.</p>

      <nav class="mf-seg" aria-label="Вхід або реєстрація">
        <a class="active" href="/login.html">Вхід</a>
        <a href="/register.html">Реєстрація</a>
      </nav>

      <div id="oauthBlock" class="mf-oauth mf-hidden">
        <button type="button" class="mf-oauth-btn" id="googleBtn"><span class="g-icon">G</span> Увійти з Google</button>
        <button type="button" class="mf-oauth-btn" id="appleBtn"><span class="a-icon"></span> Увійти з Apple</button>
      </div>
      <div id="oauthOr" class="mf-or mf-hidden">або</div>

      <form id="classicForm">
        <label class="mf-label" for="login">Логін</label>
        <input id="login" name="login" type="text" autocomplete="username" placeholder="Ваш логін" required>

        <label class="mf-label" for="password">Пароль</label>
        <div class="mf-password">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Пароль" required>
          <button type="button" class="mf-toggle-eye" id="passwordToggle"><span class="eye-label">Показати</span></button>
        </div>

        <button type="submit" class="mf-btn mf-btn-primary" id="classicSubmitBtn">
          <span id="classicSubmitText">Увійти</span>
        </button>
      </form>

      <div id="telegramBlock" class="mf-hidden">
        <hr class="mf-divider">
        <button type="button" class="mf-btn mf-btn-ghost" id="togglePhoneBtn">Вхід через Telegram-код</button>

        <div id="phonePanel" class="mf-hidden" style="margin-top:14px">
          <div id="stepPhone">
            <label class="mf-label" for="phone">Номер телефону</label>
            <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+380111111111">
            <p class="mf-hint">Спочатку <a href="/link-telegram.html">підключіть Telegram-бота</a> до акаунта — інакше код не прийде.</p>
            <button type="button" class="mf-btn mf-btn-dark" id="requestBtn"><span id="requestBtnText">Отримати код</span></button>
          </div>
          <div id="stepOtp" class="mf-hidden">
            <p class="mf-phone-sent">Код надіслано на <strong id="phoneDisplay"></strong></p>
            <label class="mf-label" for="otpCode">Код з Telegram</label>
            <input id="otpCode" class="mf-otp-input" type="text" inputmode="numeric" maxlength="6" placeholder="000000">
            <button type="button" class="mf-btn mf-btn-dark" id="verifyBtn"><span id="verifyBtnText">Підтвердити</span></button>
            <button type="button" class="mf-btn mf-btn-link" id="changePhoneBtn">Змінити номер</button>
          </div>
        </div>
      </div>

      <div id="message" class="mf-msg" role="alert"></div>
    </div>

    <p class="mf-foot">
      Немає акаунта? <a href="/register.html">Зареєструйтесь</a>.
    </p>
    <p class="mf-links"><a href="/forgot-password.html">Забули пароль?</a></p>
  </div>

  <script>
    const classicForm = document.getElementById('classicForm');
    const message = document.getElementById('message');
    const stepPhone = document.getElementById('stepPhone');
    const stepOtp = document.getElementById('stepOtp');
    const loginSub = document.getElementById('loginSub');
    let oauthConfig = {};
    let telegramConfigured = false;
    let savedPhone = '';

    function safeNextPath() {
      try {
        const next = new URLSearchParams(location.search).get('next') || '';
        if (next.startsWith('/') && !next.startsWith('//') && !next.includes('\\')) return next;
      } catch (_) {}
      return '';
    }

    function redirectByRole(role) {
      const next = safeNextPath();
      if (next === '/admin' && (role === 'admin' || role === 'provider')) {
        location.href = '/admin';
        return;
      }
      if (next === '/client' && role === 'client') {
        location.href = '/client';
        return;
      }
      if (role === 'admin' || role === 'provider') location.href = '/admin';
      else if (role === 'client') location.href = '/client';
      else location.href = '/';
    }

    function showError(text, html) {
      if (html) message.innerHTML = html;
      else message.textContent = text;
      message.className = 'mf-msg err';
    }
    function showSuccess(text) {
      message.textContent = text;
      message.className = 'mf-msg ok';
    }
    function clearMessage() {
      message.textContent = '';
      message.className = 'mf-msg';
      message.innerHTML = '';
    }

    function updateSubtitle() {
      const parts = ['логіном і паролем'];
      if (oauthConfig.googleEnabled) parts.push('Google');
      if (oauthConfig.appleEnabled) parts.push('Apple');
      if (telegramConfigured) parts.push('кодом у Telegram');
      if (parts.length === 1) {
        loginSub.textContent = 'Увійдіть логіном і паролем. Якщо акаунта ще немає — зареєструйтесь.';
        return;
      }
      loginSub.textContent = 'Увійдіть ' + parts.join(', ').replace(/, ([^,]+)$/, ' або $1') + '.';
    }

    document.getElementById('passwordToggle').onclick = () => {
      const input = document.getElementById('password');
      const label = document.querySelector('#passwordToggle .eye-label');
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      label.textContent = show ? 'Сховати' : 'Показати';
    };

    document.getElementById('togglePhoneBtn').onclick = () => {
      document.getElementById('phonePanel').classList.toggle('mf-hidden');
    };

    classicForm.onsubmit = async (e) => {
      e.preventDefault();
      clearMessage();
      const btn = document.getElementById('classicSubmitBtn');
      const text = document.getElementById('classicSubmitText');
      btn.disabled = true;
      text.textContent = 'Вхід…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            login: document.getElementById('login').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Невірний логін або пароль');
        showSuccess('Успішний вхід');
        redirectByRole(data.user?.role);
      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
        text.textContent = 'Увійти';
      }
    };

    document.getElementById('requestBtn').onclick = async () => {
      clearMessage();
      const phone = document.getElementById('phone').value.trim();
      if (!phone) return showError('Вкажіть номер телефону');
      const btn = document.getElementById('requestBtn');
      const text = document.getElementById('requestBtnText');
      btn.disabled = true;
      text.textContent = 'Надсилаємо…';
      try {
        const res = await fetch('/api/auth/otp/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone }),
        });
        const data = await res.json();
        if (!res.ok) {
          const hint = data.needsTelegramLink
            ? ' Спочатку <a href="/link-telegram.html">підключіть Telegram</a>.'
            : '';
          throw Object.assign(new Error(data.error || 'Не вдалося надіслати код'), { html: (data.error || '') + hint });
        }
        savedPhone = data.phone || phone;
        document.getElementById('phoneDisplay').textContent = savedPhone;
        stepPhone.classList.add('mf-hidden');
        stepOtp.classList.remove('mf-hidden');
        showSuccess('Код надіслано в Telegram');
      } catch (err) {
        if (err.html) showError('', err.html);
        else showError(err.message);
      } finally {
        btn.disabled = false;
        text.textContent = 'Отримати код';
      }
    };

    document.getElementById('verifyBtn').onclick = async () => {
      clearMessage();
      const code = document.getElementById('otpCode').value.trim();
      if (!code) return showError('Введіть код з Telegram');
      const btn = document.getElementById('verifyBtn');
      const text = document.getElementById('verifyBtnText');
      btn.disabled = true;
      text.textContent = 'Перевірка…';
      try {
        const res = await fetch('/api/auth/otp/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: savedPhone, code }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Невірний код');
        showSuccess('Успішний вхід');
        redirectByRole(data.user?.role);
      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
        text.textContent = 'Підтвердити';
      }
    };

    document.getElementById('changePhoneBtn').onclick = () => {
      stepOtp.classList.add('mf-hidden');
      stepPhone.classList.remove('mf-hidden');
      clearMessage();
    };

    async function finishOauth(url, payload) {
      clearMessage();
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || data.error || 'Помилка OAuth');
      showSuccess('Успішний вхід');
      redirectByRole(data.user?.role);
    }

    async function setupAuthOptions() {
      try {
        const [oauthRes, tgRes] = await Promise.all([
          fetch('/api/auth/oauth-config', { cache: 'no-store' }),
          fetch('/api/telegram/status', { cache: 'no-store' }),
        ]);
        oauthConfig = oauthRes.ok ? await oauthRes.json() : {};
        const tg = tgRes.ok ? await tgRes.json() : {};
        telegramConfigured = Boolean(tg.configured);
      } catch (_) {
        oauthConfig = {};
        telegramConfigured = false;
      }

      const showOauth = oauthConfig.googleEnabled || oauthConfig.appleEnabled;
      document.getElementById('oauthBlock').classList.toggle('mf-hidden', !showOauth);
      document.getElementById('oauthOr').classList.toggle('mf-hidden', !showOauth);
      document.getElementById('googleBtn').classList.toggle('mf-hidden', !oauthConfig.googleEnabled);
      document.getElementById('appleBtn').classList.toggle('mf-hidden', !oauthConfig.appleEnabled);
      document.getElementById('telegramBlock').classList.toggle('mf-hidden', !telegramConfigured);
      updateSubtitle();

      if (oauthConfig.googleEnabled && window.google?.accounts?.id) {
        google.accounts.id.initialize({
          client_id: oauthConfig.googleClientId,
          callback: async (response) => {
            try {
              await finishOauth('/api/auth/google', { credential: response.credential, role: 'client' });
            } catch (err) {
              showError(err.message);
            }
          },
        });
      }

      document.getElementById('googleBtn').onclick = () => {
        if (!oauthConfig.googleEnabled) return showError('Google вхід ще не налаштовано');
        if (window.google?.accounts?.id) google.accounts.id.prompt();
        else showError('Google SDK ще завантажується, спробуйте знову');
      };

      document.getElementById('appleBtn').onclick = async () => {
        if (!oauthConfig.appleEnabled) return showError('Apple вхід ще не налаштовано');
        try {
          AppleID.auth.init({
            clientId: oauthConfig.appleClientId,
            scope: 'name email',
            redirectURI: window.location.origin + '/login.html',
            usePopup: true,
          });
          const response = await AppleID.auth.signIn();
          await finishOauth('/api/auth/apple', {
            id_token: response.authorization?.id_token,
            code: response.authorization?.code,
            user: response.user,
            role: 'client',
          });
        } catch (err) {
          if (err?.error !== 'popup_closed_by_user') showError(err.message || 'Apple Sign In скасовано');
        }
      };
    }

    setupAuthOptions();
  </script>
</body>
</html>
