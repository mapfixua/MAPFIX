<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapfix — Відновлення пароля</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .wrap { width: 100%; max-width: 420px; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; text-align: center; }
    .sub { color: #64748b; margin-bottom: 24px; font-size: 0.95rem; text-align: center; line-height: 1.45; }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tabs button {
      flex: 1;
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
      min-height: 40px;
      font-size: 0.9rem;
    }
    .tabs button.active { background: #007bff; color: #fff; border-color: #007bff; }
    label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 46px;
    }
    button:disabled { opacity: 0.65; cursor: not-allowed; }
    .hidden { display: none !important; }
    .msg { margin-top: 14px; padding: 12px; border-radius: 8px; font-size: 0.9rem; display: none; line-height: 1.45; }
    .msg.err { display: block; background: #fee2e2; color: #991b1b; }
    .msg.ok { display: block; background: #dcfce7; color: #166534; }
    .links { margin-top: 20px; text-align: center; font-size: 0.9rem; }
    .links a { color: #007bff; text-decoration: none; margin: 0 6px; }
    .password-field { display: flex; gap: 8px; margin-bottom: 14px; }
    .password-field input { margin-bottom: 0; flex: 1; }
    .password-toggle {
      width: auto; min-width: 48px; background: #f1f5f9; color: #0f172a;
      border: 1px solid #cbd5e1; font-size: 0.78rem; font-weight: 700; padding: 0 12px;
    }
    .field-hint { font-size: 0.8rem; color: #64748b; margin: -8px 0 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Відновлення пароля</h1>
    <p class="sub">Отримайте код у Telegram або посилання на email</p>

    <div class="card">
      <div class="tabs">
        <button type="button" class="active" id="tabPhone">Телефон</button>
        <button type="button" id="tabEmail">Email</button>
      </div>

      <div id="panelPhone">
        <div id="phoneStep1">
          <label for="phone">Номер телефону</label>
          <input id="phone" type="tel" placeholder="050 123 45 67" autocomplete="tel">
          <p class="field-hint">Потрібен привʼязаний Telegram (як для OTP-входу)</p>
          <button type="button" id="requestPhoneBtn">Надіслати код у Telegram</button>
        </div>
        <div id="phoneStep2" class="hidden">
          <label for="code">Код з Telegram</label>
          <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
          <label for="newPasswordPhone">Новий пароль</label>
          <div class="password-field">
            <input id="newPasswordPhone" type="password" minlength="6" autocomplete="new-password">
            <button type="button" class="password-toggle" data-target="newPasswordPhone">Показати</button>
          </div>
          <button type="button" id="resetPhoneBtn">Зберегти пароль</button>
        </div>
      </div>

      <div id="panelEmail" class="hidden">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
        <p class="field-hint">Лист із посиланням прийде, якщо email збережено в профілі</p>
        <button type="button" id="requestEmailBtn">Надіслати посилання</button>
      </div>

      <div id="message" class="msg" role="alert"></div>
    </div>

    <p class="links">
      <a href="/login.html">← До входу</a>
      <a href="/link-telegram.html">Підключити Telegram</a>
    </p>
  </div>

  <script>
    const message = document.getElementById('message');
    const panelPhone = document.getElementById('panelPhone');
    const panelEmail = document.getElementById('panelEmail');
    const tabPhone = document.getElementById('tabPhone');
    const tabEmail = document.getElementById('tabEmail');
    let savedPhone = '';

    function showMsg(text, ok) {
      message.textContent = text;
      message.className = 'msg ' + (ok ? 'ok' : 'err');
    }

    tabPhone.onclick = () => {
      tabPhone.classList.add('active');
      tabEmail.classList.remove('active');
      panelPhone.classList.remove('hidden');
      panelEmail.classList.add('hidden');
      message.className = 'msg';
    };
    tabEmail.onclick = () => {
      tabEmail.classList.add('active');
      tabPhone.classList.remove('active');
      panelEmail.classList.remove('hidden');
      panelPhone.classList.add('hidden');
      message.className = 'msg';
    };

    document.querySelectorAll('.password-toggle').forEach((btn) => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.textContent = show ? 'Сховати' : 'Показати';
      });
    });

    document.getElementById('requestPhoneBtn').onclick = async () => {
      const phone = document.getElementById('phone').value.trim();
      try {
        const res = await fetch('/api/auth/password/reset-request', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ method: 'phone', phone }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || data.error);
        savedPhone = data.phone || phone;
        document.getElementById('phoneStep1').classList.add('hidden');
        document.getElementById('phoneStep2').classList.remove('hidden');
        showMsg(data.message || 'Код надіслано в Telegram', true);
      } catch (err) {
        showMsg(err.message, false);
      }
    };

    document.getElementById('resetPhoneBtn').onclick = async () => {
      try {
        const res = await fetch('/api/auth/password/reset', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            method: 'phone',
            phone: savedPhone,
            code: document.getElementById('code').value.trim(),
            newPassword: document.getElementById('newPasswordPhone').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || data.error);
        showMsg('Пароль оновлено. Перенаправлення…', true);
        const role = data.user?.role;
        setTimeout(() => {
          if (role === 'admin' || role === 'provider') location.href = '/admin';
          else if (role === 'client') location.href = '/client';
          else location.href = '/login.html';
        }, 800);
      } catch (err) {
        showMsg(err.message, false);
      }
    };

    document.getElementById('requestEmailBtn').onclick = async () => {
      try {
        const res = await fetch('/api/auth/password/reset-request', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            method: 'email',
            email: document.getElementById('email').value.trim(),
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || data.error);
        showMsg(data.message || 'Перевірте пошту', true);
      } catch (err) {
        showMsg(err.message, false);
      }
    };
  </script>
</body>
</html>
