<html lang="uk"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Mapfix — Карта послуг</title>
    <meta name="description" content="Mapfix — карта локальних послуг поруч із вами. Знайдіть майстра, замовте послугу, залиште відгук.">
    <meta property="og:title" content="Mapfix — Карта послуг">
    <meta property="og:description" content="Знайдіть майстра поруч: краса, авто, ремонт, дім та інше.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mapfix-wine.vercel.app/">
    <meta name="theme-color" content="#12c4b5">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/favicon.svg">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #12c4b5;
            --primary-light: #e6faf8;
            --success: #0f6b45;
            --danger: #b42318;
            --dark: #0b0d10;
            --border: #e4e6eb;
            --bg: #eceef2;
            --ink: #0b0d10;
            --muted: #6b7280;
            --sidebar-width: 420px;
            --desktop-max: 100%;
            --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);
            --font: 'Manrope', 'Segoe UI', sans-serif;
        }

        * { -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: var(--font);
            overflow: hidden;
            background: var(--bg);
            height: 100vh;
            height: 100dvh;
            color: var(--ink);
        }

        #app-shell {
            display: flex;
            height: 100vh;
            height: 100dvh;
            width: 100%;
            background: var(--bg);
        }

        #map-container {
            position: relative;
            z-index: 1;
            min-width: 0;
        }

        #map { width: 100%; height: 100%; z-index: 1; }

        #sidebar {
            background: white;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            z-index: 5;
        }

        .sheet-drag-handle { display: none; }

        .category-strip-wrap {
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
            background: #fff;
        }
        .category-strip {
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .category-strip::-webkit-scrollbar { display: none; }
        .category-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1.5px solid var(--border);
            background: #fff;
            cursor: pointer;
            border-radius: 16px;
            transition: transform 0.2s var(--ease-sheet), border-color 0.2s, background 0.2s, box-shadow 0.2s;
            touch-action: manipulation;
        }
        .category-card:active { transform: scale(0.95); }
        .category-card.active {
            border-color: var(--ink);
            background: #fff;
            box-shadow: 0 0 0 1px var(--ink);
        }
        .category-card-icon {
            border-radius: 50%;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink);
            transition: transform 0.2s var(--ease-sheet), color 0.2s, background 0.2s;
        }
        .category-card.active .category-card-icon {
            background: var(--accent, var(--primary));
            color: var(--ink);
        }
        .category-card-label {
            font-weight: 800;
            text-align: center;
            color: var(--dark);
        }

        .sheet-panel {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            opacity: 1;
            transition: opacity 0.28s ease, transform 0.32s var(--ease-sheet);
        }
        .sheet-panel.sheet-content-enter {
            animation: sheetContentIn 0.32s var(--ease-sheet);
        }
        @keyframes sheetContentIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sidebar-view {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            background: white;
            box-sizing: border-box;
        }

        .sheet-body-host {
            flex: 1;
            min-height: 0;
            position: relative;
            overflow: hidden;
            background: #f8fafc;
        }
        #sidebar-list-view { position: relative; z-index: 2; }
        #sidebar-detail-view {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            transition: transform 0.32s var(--ease-sheet);
        }
        #sidebar-detail-view.show {
            transform: translateX(0);
            pointer-events: auto;
        }

        /* ШАПКА СПИСКУ */
        .sidebar-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: white;
            flex-shrink: 0;
        }
        .sort-panel {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 0;
        }
        .sort-label { font-size: 11px; font-weight: 800; color: var(--dark); text-transform: uppercase; letter-spacing: 0.4px; margin: 0; }
        .sort-select { width: 100%; height: 34px; border: 1px solid var(--border); border-radius: 8px; background-color: white; padding: 0 10px; font-size: 13px; font-weight: 700; color: #475569; outline: none; cursor: pointer; margin: 0; }
        .hotline-filter-bar { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: #475569; margin: 0; }
        .hotline-filter-bar input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: var(--primary); margin: 0; }

        .sidebar-content {
            flex-grow: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            padding: 0 12px 12px;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #f8fafc;
        }

        .nav-title { font-size: 15px; font-weight: 800; color: var(--dark); margin: 0; line-height: 1.3; }
        .sidebar-header .back-btn {
            margin: 0;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 800;
            color: var(--ink);
            background: var(--primary-light);
            border: 1.5px solid var(--ink);
            border-radius: 10px;
            gap: 8px;
            min-height: 40px;
        }
        .sidebar-header .back-btn i { font-size: 14px; }
        .nav-item {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            margin: 0;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-weight: 700;
            font-size: 14px;
            color: var(--dark);
        }
        .nav-item:hover { background: #f1f5f9; border-color: #cbd5e1; }
        .nav-item.active { background: var(--primary-light); color: var(--ink); border-color: var(--ink); }
        .nav-item-arrow { color: #94a3b8; font-size: 13px; flex-shrink: 0; margin: 0; }
        .nav-item-meta { font-size: 11px; font-weight: 600; color: #64748b; margin: 2px 0 0; line-height: 1.25; }
        .nav-hint {
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
            padding: 14px 12px;
            margin: 0;
            line-height: 1.4;
        }
        .ai-suggestions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px 12px;
            background: #f0fdfa;
            border-bottom: 1px solid #99f6e4;
        }
        .ai-suggestions-title {
            font-size: 11px;
            font-weight: 800;
            color: #0f766e;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .ai-suggestion-chip {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
            width: 100%;
            text-align: left;
            border: 1.5px solid #99f6e4;
            background: #fff;
            border-radius: 12px;
            padding: 10px 12px;
            cursor: pointer;
            font-family: inherit;
            color: var(--ink);
        }
        .ai-suggestion-chip:hover { border-color: var(--ink); }
        .ai-suggestion-chip.active {
            border-color: var(--ink);
            box-shadow: 0 0 0 1px var(--ink);
            background: var(--primary-light);
        }
        .ai-suggestion-type {
            font-size: 10px;
            font-weight: 800;
            color: #0f766e;
            text-transform: uppercase;
        }
        .ai-suggestion-label {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.25;
        }

        .provider-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px 14px;
            margin: 0;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .provider-card:hover { background: #f8fafc; border-color: #cbd5e1; }
        .provider-card.active { background: var(--primary-light); border-color: var(--primary); }
        .provider-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin: 0; }
        .provider-title { font-weight: 700; font-size: 14px; color: var(--dark); margin: 0; line-height: 1.25; }
        .rating-block { display: flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; margin: 0; }
        .star-icon { color: #ffb703; }
        .reviews-count { color: #94a3b8; font-weight: 500; }
        .provider-desc { font-size: 12px; color: #64748b; margin: 0; line-height: 1.3; }
        .provider-meta { display: flex; align-items: center; gap: 6px; font-size: 11px; margin: 0; }
        .status-badge { padding: 2px 6px; border-radius: 4px; font-weight: 700; font-size: 9px; text-transform: uppercase; margin: 0; }
        .status-badge.open { background: #dcfce7; color: #166534; }
        .status-badge.closed { background: #fee2e2; color: #991b1b; }
        .distance-badge { background: #f1f5f9; color: #475569; padding: 2px 6px; border-radius: 4px; font-weight: 600; margin: 0; }
        .provider-price-row { display: flex; justify-content: space-between; align-items: center; margin: 0; padding-top: 6px; border-top: 1px dashed var(--border); }
        .provider-badge { font-size: 10px; font-weight: 700; color: #475569; background: #f1f5f9; padding: 3px 6px; border-radius: 4px; margin: 0; }
        .provider-card-price { font-size: 14px; font-weight: 800; color: var(--success); margin: 0; }

        /* ДЕТАЛЬНА КАРТКА */
        .detail-header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; background: white; }
        .back-btn { background: none; border: none; color: var(--primary); font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 0; width: fit-content; }
        .detail-main-title { font-size: 18px; font-weight: 800; color: var(--dark); margin: 0; }
        
        .detail-actions-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
        .action-btn { flex: 1 1 calc(50% - 4px); min-width: 120px; height: 38px; border-radius: 8px; border: none; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
        .btn-call { background: var(--success); color: white; }
        .btn-route { background: var(--ink); color: white; }
        .btn-directions { background: var(--primary); color: var(--ink); }

        .detail-scroll-body { flex-grow: 1; overflow-y: auto; padding: 20px; background: #f8fafc; display: flex; flex-direction: column; gap: 16px; }
        #sidebar-detail-view.mode-dive .detail-scroll-body {
            animation: detail-dive-in 0.28s var(--ease-sheet);
        }
        @keyframes detail-dive-in {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .btn-dive {
            background: var(--primary);
            color: var(--ink);
            flex: 1 1 100%;
        }
        .detail-preview-hint {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            margin: 0;
            line-height: 1.35;
        }
        @media (max-width: 768px) {
            #sidebar-detail-view.mode-preview {
                cursor: pointer;
            }
            #sidebar-detail-view.mode-preview .detail-header {
                padding: 10px 14px 12px;
                gap: 8px;
                overflow-y: auto;
                flex: 1;
                min-height: 0;
            }
            #sidebar-detail-view.mode-preview .detail-actions-row {
                gap: 6px;
            }
            #sidebar-detail-view.mode-preview .detail-actions-row .action-btn:not(.btn-dive):not(.btn-call) {
                display: none;
            }
            #sidebar-detail-view.mode-preview .btn-fav-header {
                display: none;
            }
            #sidebar-detail-view.mode-preview .detail-scroll-body {
                display: none;
            }
            #sidebar-detail-view.mode-dive .detail-scroll-body {
                display: flex;
            }
            #sidebar-detail-view.mode-dive .detail-header {
                flex-shrink: 0;
                overflow: visible;
            }
        }
        .detail-section { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
        .detail-photos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .detail-photos a {
            display: block;
            aspect-ratio: 1;
            border-radius: 10px;
            overflow: hidden;
            background: #f1f5f9;
        }
        .detail-photos img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .section-title { font-size: 12px; font-weight: 800; color: #64748b; text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 4px; margin: 0; }
        
        .info-item { display: flex; gap: 8px; font-size: 13px; color: var(--dark); font-weight: 600; }
        .schedule-table { display: flex; flex-direction: column; gap: 4px; font-size: 12px; width: 100%; color: #475569; }
        .schedule-row { display: flex; justify-content: space-between; padding: 2px 0; }

        .detail-price-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 13px; font-weight: 700; }
        .detail-price-row:last-child { border-bottom: none; }
        .detail-price-val { color: var(--success); font-weight: 800; }

        .review-item { display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .review-item:last-child { border-bottom: none; padding-bottom: 0; }
        .review-top-line { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: #64748b; }
        .review-stars { color: #ffb703; letter-spacing: 1px; }
        .review-text { font-size: 12px; color: var(--dark); font-weight: 500; line-height: 1.4; }

        /* ФОРМА ВІДГУКУ */
        .review-form { display: flex; flex-direction: column; gap: 10px; margin-top: 5px; }
        .rating-stars-input { display: flex; gap: 6px; font-size: 24px; cursor: pointer; color: #cbd5e1; user-select: none; }
        .rating-stars-input span:hover,
        .rating-stars-input span.active { color: #ffb703; }
        .review-textarea { width: 100%; height: 60px; border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-size: 12px; font-family: inherit; outline: none; resize: none; box-sizing: border-box; }
        .review-textarea:focus { border-color: var(--primary); }
        .submit-review-btn { background: var(--dark); color: white; border: none; height: 34px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; }

        .detail-price-row { position: relative; }
        .detail-price-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
        .btn-order {
            background: var(--success);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-order:hover { filter: brightness(1.05); }
        .btn-fav-header {
            background: #fff;
            border: 2px solid #fbbf24;
            color: #b45309;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-fav-header.active { background: #fef3c7; }

        .top-header {
            position: absolute; top: 12px; left: 12px; right: 12px; z-index: 10;
            display: flex; flex-direction: column; gap: 10px; pointer-events: none;
        }
        .top-header-row {
            display: flex; gap: 8px; align-items: center; width: 100%;
        }
        .top-header-end {
            display: flex; align-items: center; gap: 8px; flex-shrink: 0; pointer-events: auto;
        }
        .brand-chip {
            display: inline-flex; align-items: center; gap: 8px;
            height: auto; min-height: 48px; padding: 6px 14px 6px 8px;
            background: #fff; border-radius: 999px;
            box-shadow: 0 8px 28px rgba(11,13,16,0.1);
            pointer-events: auto; flex-shrink: 0;
            text-decoration: none; color: var(--ink);
            border: none; cursor: pointer; font-family: inherit;
        }
        .brand-chip-mark {
            width: 32px; height: 32px; border-radius: 50%;
            background: var(--ink); color: #fff;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 0.9rem; flex-shrink: 0;
        }
        .brand-chip-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.1;
            gap: 1px;
        }
        .brand-chip-name { font-weight: 800; font-size: 0.98rem; letter-spacing: -0.03em; }
        .brand-chip-home {
            font-size: 10px;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.01em;
        }
        .search-container {
            flex-grow: 1; background: white; border-radius: 999px;
            padding: 5px 10px 5px 16px; display: flex; align-items: center;
            box-shadow: 0 8px 28px rgba(11,13,16,0.1);
            height: 48px; pointer-events: auto; position: relative;
            border: 1.5px solid transparent;
        }
        .search-container:focus-within { border-color: var(--primary); }
        .search-container input {
            border: none; width: 100%; outline: none; font-size: 15px;
            margin-left: 8px; flex: 1; min-width: 0; font-family: inherit; font-weight: 600;
            background: transparent; color: var(--ink);
        }
        .search-container input::placeholder { color: #9ca3af; font-weight: 500; }
        .voice-mic-btn {
            width: 36px; height: 36px; border: none; border-radius: 50%; background: var(--primary-light);
            color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 16px; flex-shrink: 0; transition: background 0.2s, transform 0.15s;
        }
        .voice-mic-btn:hover { background: #c8f3ee; }
        .voice-mic-btn.listening { background: #fee2e2; color: #dc2626; animation: mic-pulse 1s ease-in-out infinite; }
        .voice-mic-btn.processing { background: #fef3c7; color: #b45309; }
        @keyframes mic-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        .voice-status {
            position: absolute; top: calc(100% + 8px); left: 0; right: 0;
            background: var(--ink); color: #fff; font-size: 13px; font-weight: 600;
            padding: 10px 14px; border-radius: 14px; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.18); z-index: 20; pointer-events: none;
        }
        .voice-status.hidden { display: none; }
        .voice-pulse {
            width: 10px; height: 10px; border-radius: 50%; background: #ef4444; flex-shrink: 0;
            animation: voice-dot 1s ease-in-out infinite;
        }
        @keyframes voice-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.7); } }
        .brand-logo { display: none; }
        .header-btn {
            height: 48px; background: white; border-radius: 999px; border: none;
            box-shadow: 0 8px 28px rgba(11,13,16,0.1); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 800; pointer-events: auto; font-family: inherit;
        }
        .profile-wrap { position: relative; pointer-events: auto; }
        .profile-btn { width: 48px; height: 48px; border-radius: 50%; font-size: 18px; padding: 0; flex-shrink: 0; }
        .profile-btn.logged-in { background: var(--primary-light); border: 2px solid var(--primary); }
        .login-btn {
            padding: 0 18px; color: #fff; background: var(--ink); gap: 8px; white-space: nowrap;
        }
        .login-btn:hover { background: #22262c; }
        .login-btn.hidden { display: none; }
        .profile-btn.hidden,
        .hidden { display: none !important; }
        .add-business-btn {
            padding: 0 14px; color: var(--ink); background: var(--primary); white-space: nowrap; gap: 6px;
        }
        .add-business-btn:hover { filter: brightness(0.96); }
        .add-business-btn .btn-label { margin-right: 0; }
        .user-menu {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            min-width: 200px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.12);
            border: 1px solid var(--border);
            overflow: hidden;
            z-index: 1000;

        #geo-btn {

        .user-location-marker-wrap {

        /* ========== DESKTOP (≥769px) — повноцінний сервіс: широка карта + sidebar-сітка ========== */

    <script>
        async function loadCatalogData() {
            const res = await fetch(`/api/data?t=${Date.now()}`, {
                cache: 'no-store',
                credentials: 'same-origin',
                headers: { 'Cache-Control': 'no-cache', Pragma: 'no-cache' },
            });
            if (!res.ok) throw new Error('Не вдалося завантажити каталог');
            const data = await res.json();
            window.masterCatalog = data.masterCatalog || {};
            window.mockLocations = data.mockLocations || [];
            window.providerProfiles = data.providerProfiles || {};
            window.catalogClicks = data.catalogClicks || {};
        }

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                await loadCatalogData();
            } catch (err) {
                console.error(err);
                alert('Помилка завантаження даних. Перевірте, що сервер запущено.');
                return;
            }

            const map = L.map('map', { zoomControl: false }).setView([50.4501, 30.5234], 11);

                return L.divIcon({

            function calculateDistance(lat1, lon1, lat2, lon2) {
                const R = 6371;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
                return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
            }

            function locateUser({ center = true, fromButton = false } = {}) {
                if (!navigator.geolocation) {

                    return;
                }
                if (geoBtn) geoBtn.classList.add('locating');
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        if (geoBtn) geoBtn.classList.remove('locating');
                        setUserLocation(pos.coords.latitude, pos.coords.longitude, {
                            center: fromButton ? true : center && shouldAutoCenterOnUser(),
                            zoom: USER_FOCUS_ZOOM,
                        });
                    },
                    (err) => {
                        if (geoBtn) geoBtn.classList.remove('locating');
                        console.warn('[geo]', err && err.message ? err.message : err);
                        if (fromButton) {
                            const denied = err && err.code === 1;
                            alert(
                                denied
                                    ? 'Доступ до геолокації заборонено. Дозвольте його в налаштуваннях браузера.'
                                    : 'Не вдалося визначити місцезнаходження. Спробуйте ще раз.'

                    },
                    {

                    return;

                googleImportMessage.className = 'import-message';
                googleImportMessage.textContent = dryRun ? 'Розпізнаємо місце…' : 'Додаємо на карту…';
                const body = { url, dryRun };
                if (!dryRun) {
                    body.category = document.getElementById('googleImportCategory')?.value || googleImportData?.category;
                    body.subcategory = document.getElementById('googleImportSubcategory')?.value || '';
                }
                try {
                    const response = await fetch('/api/import-google-maps-url', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    const data = await response.json().catch(() => ({}));
                    if (!response.ok) throw new Error(data.error || 'Не вдалося імпортувати місце');
                    if (dryRun) {
                        renderGoogleImportPreview(data);
                        googleImportMessage.className = 'import-message success';
                        googleImportMessage.textContent = `Знайдено. AI категорія: ${data.categoryName || data.category}`;
